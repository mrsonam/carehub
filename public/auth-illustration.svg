<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Healthcare illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00488d" stop-opacity="0.14" />
      <stop offset="1" stop-color="#006a6a" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.60" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="40" y="40" width="520" height="520" rx="48" fill="url(#bg)" />

  <!-- Decorative dots -->
  <circle cx="115" cy="130" r="10" fill="#00488d" opacity="0.22" />
  <circle cx="485" cy="155" r="14" fill="#006a6a" opacity="0.18" />
  <circle cx="470" cy="420" r="9" fill="#00488d" opacity="0.14" />
  <circle cx="135" cy="430" r="12" fill="#006a6a" opacity="0.12" />

  <!-- Card -->
  <rect x="165" y="145" width="270" height="310" rx="28" fill="url(#card)" stroke="#727783" stroke-opacity="0.12" />

  <!-- Shield -->
  <path
    d="M300 210
       C330 225 365 230 395 230
       V295
       C395 355 355 405 300 430
       C245 405 205 355 205 295
       V230
       C235 230 270 225 300 210Z"
    fill="#00488d"
    opacity="0.12"
    stroke="#00488d"
    stroke-opacity="0.35"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Cross -->
  <rect x="286" y="272" width="28" height="6" rx="3" fill="#00488d" />
  <rect x="292" y="266" width="6" height="40" rx="3" fill="#00488d" />
  <rect x="280" y="292" width="40" height="6" rx="3" fill="#00488d" opacity="0.9" />

  <!-- Stethoscope-ish arc -->
  <path
    d="M245 325
       C235 290 255 265 290 262
       C310 260 330 270 338 285
       C350 307 340 330 315 340"
    fill="none"
    stroke="#006a6a"
    stroke-opacity="0.45"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Small heart -->
  <path
    d="M372 332
       C360 316 345 315 340 332
       C336 346 348 360 372 375
       C396 360 408 346 404 332
       C399 315 384 316 372 332Z"
    fill="#006a6a"
    opacity="0.22"
    stroke="#006a6a"
    stroke-opacity="0.45"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Bottom accents -->
  <path d="M210 420 H390" stroke="#00488d" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round" />
  <path d="M235 445 H365" stroke="#006a6a" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round" />
</svg>

